# fly.toml — configuration for the Cutline app.
# See https://fly.io/docs/reference/configuration/
#
# Secrets are set out of band and are never committed here:
#   fly secrets set CUTLINE_SECRET=... DATABASE_URL=...

app = 'cutline'

# London, not Johannesburg. Supabase is in eu-west-1 (Ireland) and each request
# makes several round trips to the database, so the app is placed next to the
# database rather than next to the users — that turns N slow hops into one.
primary_region = 'lhr'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '4000'

[http_service]
  internal_port = 4000
  force_https = true

  # Live scoring is pushed over WebSockets and realtime.js keeps its rooms in a
  # plain in-memory Map. A second machine would hold a separate set of rooms, so
  # players in one game could land on different instances and stop seeing each
  # other's scores. Until that state moves into Postgres, this app runs as
  # exactly one always-on machine.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'
